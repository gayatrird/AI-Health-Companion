{% extends "base.html" %}{% block title %}Feedback | AI Health Companion{% endblock %}{% block content %}
<section class="page-hero"><div class="container"><p class="eyebrow">HELP US IMPROVE</p><h1>Share your feedback</h1><p>Your feedback helps improve this educational college project. Name and email are optional.</p></div></section><section class="section compact"><div class="container narrow"><form id="feedback-form" class="form-card"><label>Name (optional)<input name="name" maxlength="80"></label><label>Email (optional)<input name="email" type="email" maxlength="120"></label><label>Rating <select name="rating" required><option value="">Choose a rating</option><option value="5">5 – Excellent</option><option value="4">4 – Good</option><option value="3">3 – Okay</option><option value="2">2 – Needs improvement</option><option value="1">1 – Poor</option></select></label><label>Feedback <textarea name="feedback" maxlength="1000" rows="6" required placeholder="Tell us what you think..."></textarea></label><button class="button button-primary" type="submit">Submit feedback</button><p id="feedback-notice" class="form-notice" aria-live="polite"></p></form></div></section>{% endblock %}
