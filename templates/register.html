{% extends "base.html" %}{% block title %}Register | AI Health Companion{% endblock %}{% block content %}
<section class="page-hero"><div class="container center-text"><p class="eyebrow">PRIVATE WELLNESS HISTORY</p><h1>Create your account</h1><p>Your password is handled by Firebase Authentication and is never stored by this project.</p></div></section>
<section class="section compact"><div class="container narrow"><form id="register-form" class="form-card auth-card" method="post"><h2>Sign Up</h2><label>Name<input name="name" maxlength="80" autocomplete="name" required></label><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" minlength="6" autocomplete="new-password" required></label><label>Confirm password<input name="confirm_password" type="password" minlength="6" autocomplete="new-password" required></label><button class="button button-primary" type="submit">Create account</button><button class="button button-google" id="google-register" type="button">Continue with Google</button><p id="auth-notice" class="form-notice" aria-live="polite"></p><p class="auth-switch">Already registered? <a href="{{ url_for('login') }}">Login</a></p></form></div></section>{% endblock %}
