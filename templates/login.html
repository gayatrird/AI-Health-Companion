{% extends "base.html" %}{% block title %}Login | AI Health Companion{% endblock %}{% block content %}
<section class="page-hero"><div class="container center-text"><p class="eyebrow">YOUR WELLNESS SPACE</p><h1>Welcome back</h1><p>Sign in to access your private cloud habit and wellness history.</p></div></section>
<section class="section compact"><div class="container narrow"><form id="login-form" class="form-card auth-card"><h2>Login</h2><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="button button-primary" type="submit">Login</button><button class="button button-google" id="google-login" type="button">Continue with Google</button><p id="auth-notice" class="form-notice" aria-live="polite"></p><p class="auth-switch">New here? <a href="{{ url_for('register') }}">Create an account</a></p></form></div></section>{% endblock %}
